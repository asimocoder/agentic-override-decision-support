[project]
name = "agentic-override-decision-support"
version = "0.5.0"
description = "Agentic Override Decision Support System for MSME Lending"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.53.0",
    "openai>=1.85.0",
    "tavily-python>=0.5.0",
    "gradio>=6.14.0",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
